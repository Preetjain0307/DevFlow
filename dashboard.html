

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | DevFlow Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/DevFlow/css/style.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.3), 0 8px 10px -6px rgb(0 0 0 / 0.3);
            width: 100%;
            max-width: 480px;
            overflow: hidden;
        }
        .auth-header {
            background: #f8fafc;
            padding: 2rem 2rem 1.5rem 2rem;
            text-align: center;
            border-bottom: 1px solid var(--df-border);
        }
        .auth-body {
            padding: 2rem;
        }
        .demo-btn {
            font-size: 0.75rem;
            padding: 0.35rem 0.6rem;
            border-radius: 0.375rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="auth-header">
        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary p-3 rounded-circle mb-3">
            <i class="bi bi-cpu-fill fs-2"></i>
        </div>
        <h4 class="fw-bold text-dark mb-1">Welcome to DevFlow</h4>
        <p class="text-muted small mb-0">Centralized Developer Collaboration Platform</p>
    </div>

    <div class="auth-body">
        
            <div class="alert alert-danger d-flex align-items-center mb-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2 flex-shrink-0"></i>
                <div class="small">Invalid username or password.</div>
            </div>
        

        

        

        <form action="/DevFlow/login" method="POST">
            <input type="hidden" name="redirect" value="">

            <div class="mb-3">
                <label class="form-label small fw-semibold text-dark">Username or Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control border-start-0" id="loginUsername" name="username" value="sarah_pm" placeholder="e.g. dev_alex or dev@devflow.io" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center">
                    <label class="form-label small fw-semibold text-dark mb-1">Password</label>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control border-start-0" id="loginPassword" name="password" placeholder="Enter your password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-df-primary w-100 py-2 mb-3">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
        </form>

        <div class="text-center small text-muted mb-4">
            Don't have an account? <a href="/DevFlow/register" class="fw-semibold text-primary text-decoration-none">Create an Account</a>
        </div>

        <!-- Quick-Fill Demo Credentials for Fast Evaluation -->
        <div class="p-3 bg-light rounded-3 border">
            <div class="fw-semibold small text-dark mb-2 d-flex align-items-center justify-content-between">
                <span><i class="bi bi-lightning-charge-fill text-warning me-1"></i> Quick Demo Logins:</span>
                <span class="text-muted" style="font-size: 0.7rem;">Password: password123</span>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-sm btn-outline-dark demo-btn" onclick="fillCredentials('admin', 'password123')">
                    <i class="bi bi-shield-fill text-danger me-1"></i>Admin
                </button>
                <button type="button" class="btn btn-sm btn-outline-dark demo-btn" onclick="fillCredentials('pm_sarah', 'password123')">
                    <i class="bi bi-person-gear text-primary me-1"></i>PM
                </button>
                <button type="button" class="btn btn-sm btn-outline-dark demo-btn" onclick="fillCredentials('dev_alex', 'password123')">
                    <i class="bi bi-code-slash text-success me-1"></i>Developer
                </button>
                <button type="button" class="btn btn-sm btn-outline-dark demo-btn" onclick="fillCredentials('tester_mark', 'password123')">
                    <i class="bi bi-bug text-warning me-1"></i>Tester
                </button>
                <button type="button" class="btn btn-sm btn-outline-dark demo-btn" onclick="fillCredentials('faculty_dr_alan', 'password123')">
                    <i class="bi bi-award text-info me-1"></i>Faculty
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    function fillCredentials(username, password) {
        document.getElementById('loginUsername').value = username;
        document.getElementById('loginPassword').value = password;
    }
</script>
</body>
</html>
